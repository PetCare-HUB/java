spring.application.name=petcarehub-java
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=caffeine
spring.cache.cache-names=protocolos,pets,scores
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8

SEED_ENABLED=false
app.seed.enabled=true

rsa.private-key=classpath:Keys/private_key.pem
rsa.public-key=classpath:Keys/public_key.pem