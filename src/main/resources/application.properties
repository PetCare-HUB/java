spring.application.name=petcarehub-java
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=caffeine
spring.cache.cache-names=protocolos,pets,scores
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8

# Insere uma clinica + tutor de exemplo se o banco estiver genuinamente vazio
# (ver DataLoader). Seguro deixar ligado: não insere nada se já existir
# qualquer clínica.
app.seed.enabled=true

# Admin da PetCare Hub que aprova o credenciamento das clínicas.
# Sem ADMIN_EMAIL/ADMIN_PASSWORD no ambiente nenhum admin é criado - não
# existe senha padrão de propósito (ver DataLoader.seedAdmin).
app.seed.admin-email=${ADMIN_EMAIL:}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.admin-nome=${ADMIN_NOME:Admin PetCare Hub}

rsa.public-key=${RSA_PUBLIC_KEY:classpath:Keys/public_key.pem}
rsa.private-key=${RSA_PRIVATE_KEY:classpath:Keys/private_key.pem}

# ===== IA (Spring AI + Google Gemini) =====
# Uma única chave do Google para chat e embeddings (Gemini Developer API).
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.3

spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# Dimensão do vetor (gemini-embedding-001 aceita 768, 1536 ou 3072). Mudar exige reindexar a base.
spring.ai.google.genai.embedding.text.options.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:3072}

# Timeout (ms) de cada chamada ao Gemini e número de tentativas do SDK do Google em
# 429/5xx/falha de rede (ambos aplicados ao Client em IaConfig). O retry do Spring AI
# (spring.ai.retry.*) não age sobre o SDK do Google, por isso não é configurado aqui.
app.ia.timeout-ms=60000
app.ia.tentativas=2

# Em DEBUG o SimpleLoggerAdvisor grava o prompt inteiro (dados do pet e pergunta do tutor)
# no console e em logs/petcarehub.log. Suba para DEBUG só em ambiente de desenvolvimento.
logging.level.org.springframework.ai=INFO

# Parâmetros da IA do PetCare Hub (ver ia/IaProperties)
app.ia.rag.top-k=4
app.ia.rag.similarity-threshold=0.45
app.ia.pergunta.max-caracteres=500
app.ia.pergunta.memoria-max-mensagens=10
# true = indexa a base de conhecimento (.md) na subida. Também dá para
# reindexar a qualquer momento por POST /admin/ia/reindexar.
app.ia.indexar-ao-iniciar=false
app.ia.pasta-conhecimento=classpath:conhecimento/*.md
