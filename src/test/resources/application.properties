spring.application.name=petcarehub-java-test

# Banco H2 em memoria so pros testes - as migracoes Flyway sao especificas
# pra Oracle (flyway-database-oracle, sequences, etc.), entao aqui o Flyway
# fica desligado e o Hibernate cria o schema direto a partir das entidades.
spring.datasource.url=jdbc:h2:mem:petcarehub-test;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=caffeine
spring.cache.cache-names=protocolos,pets,scores
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

app.seed.enabled=false

# Par de chaves so de teste (nao usado em nenhum ambiente real) - ver
# src/test/resources/Keys/.
rsa.public-key=classpath:Keys/public_key.pem
rsa.private-key=classpath:Keys/private_key.pem
