spring.application.name=petcarehub-java-test

# Banco H2 em memoria so pros testes - as migracoes Flyway sao especificas
# pra Oracle (flyway-database-oracle, sequences, etc.), entao aqui o Flyway
# fica desligado e o Hibernate cria o schema direto a partir das entidades.
spring.datasource.url=jdbc:h2:mem:petcarehub-test;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=caffeine
spring.cache.cache-names=protocolos,pets,scores
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

app.seed.enabled=false

# Par de chaves so de teste (nao usado em nenhum ambiente real) - ver
# src/test/resources/Keys/.
rsa.public-key=classpath:Keys/public_key.pem
rsa.private-key=classpath:Keys/private_key.pem

# IA (Spring AI + Google Gemini) - mesma configuracao da aplicacao, mas sem
# depender de variavel de ambiente nem de servico externo: a chave e ficticia
# e nenhum teste deve chamar o Gemini de verdade (mockar ChatClient/VectorStore).
# O Client do SDK so abre conexao na primeira chamada, entao subir o contexto
# nao acessa a rede.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=chave-de-teste
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.3

spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=3072

app.ia.timeout-ms=60000
app.ia.tentativas=1

logging.level.org.springframework.ai=INFO

app.ia.rag.top-k=4
app.ia.rag.similarity-threshold=0.45
app.ia.pergunta.max-caracteres=500
app.ia.pergunta.memoria-max-mensagens=10
app.ia.indexar-ao-iniciar=false
app.ia.pasta-conhecimento=classpath:conhecimento/*.md
